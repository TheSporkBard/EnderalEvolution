name: Enderal smoke test

on:
  push:
    branches:
      - enderal/step3-smoke-test
  workflow_dispatch:

concurrency:
  group: enderal-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: releasedbg
      upload-build-for-next-job: true
      enderal-build: true
